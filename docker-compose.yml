services:
  postgres:
    image: postgres:16-alpine
    container_name: prueba-postgres
    environment:
      - POSTGRES_DB=legal_redactor
      - POSTGRES_USER=legal
      - POSTGRES_PASSWORD=legal123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_redactor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-redactor-network

  redis:
    image: redis:7-alpine
    container_name: prueba-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-redactor-network

  localstack:
    image: localstack/localstack:latest
    container_name: prueba-localstack
    environment:
      - SERVICES=s3
      - DEBUG=1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-redactor-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: prueba-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=legal
      - KC_DB_PASSWORD=legal123
    ports:
      - "8080:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - legal-redactor-network

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: prueba-presidio-analyzer
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-redactor-network

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: prueba-presidio-anonymizer
    ports:
      - "3001:3000"
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal-redactor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prueba-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://legal:legal123@postgres:5432/legal_redactor
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=localstack:4566
      - MINIO_ACCESS_KEY=test
      - MINIO_SECRET_KEY=test
      - MINIO_BUCKET=legal-redactor
      - MINIO_SECURE=false
      - MINIO_REGION=us-east-1
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=legal-redactor
      - KEYCLOAK_CLIENT_ID=backend-api
      - KEYCLOAK_CLIENT_SECRET=backend-secret
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - OCR_LANG=es
      - USE_LOCAL_STORAGE=false
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    networks:
      - legal-redactor-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prueba-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://legal:legal123@postgres:5432/legal_redactor
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=localstack:4566
      - MINIO_ACCESS_KEY=test
      - MINIO_SECRET_KEY=test
      - MINIO_BUCKET=legal-redactor
      - MINIO_SECURE=false
      - MINIO_REGION=us-east-1
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=legal-redactor
      - KEYCLOAK_CLIENT_ID=backend-api
      - KEYCLOAK_CLIENT_SECRET=backend-secret
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - OCR_LANG=es
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    networks:
      - legal-redactor-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prueba-celery-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://legal:legal123@postgres:5432/legal_redactor
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - legal-redactor-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prueba-frontend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=legal-redactor
      - VITE_KEYCLOAK_CLIENT_ID=frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - legal-redactor-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: prueba-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@legal.local
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - legal-redactor-network

volumes:
  pgdata:
  pgadmindata:
  redisdata:
  keycloakdata:
  localstack_data:

networks:
  legal-redactor-network:
    driver: bridge
