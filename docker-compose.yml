version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: legal-redactor-postgres
    environment:
      POSTGRES_DB: legal_redactor
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/alembic:/alembic:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      postgres -c shared_buffers=256MB
               -c work_mem=16MB
               -c maintenance_work_mem=128MB
               -c effective_cache_size=1GB
               -c max_connections=200

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: legal-redactor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@icat.cat
      PGADMIN_DEFAULT_PASSWORD: admin_pass
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports: ["5050:80"]
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: legal-redactor-redis
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: legal-redactor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Presidio services (Microsoft official images)
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: legal-redactor-presidio-analyzer
    ports: ["3000:3000"]
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: legal-redactor-presidio-anonymizer
    ports: ["3001:3000"]
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak for authentication
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: legal-redactor-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USER: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports: ["8080:8080"]
    volumes:
      - keycloakdata:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-redactor-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://legal:legal_pass@postgres:5432/legal_redactor
      - REDIS_URL=redis://redis:6379/0
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=legal-redactor
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=legal-redactor
      - KEYCLOAK_CLIENT_ID=backend-api
      - SECRET_KEY=dev-secret-change-in-production-32-chars-min
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-redactor-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q ocr,pii,redaction,export
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://legal:legal_pass@postgres:5432/legal_redactor
      - REDIS_URL=redis://redis:6379/0
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
      - PRESIDIO_ANONYMIZER_URL=http://presidio-anonymizer:3000
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=legal-redactor
      - SECRET_KEY=dev-secret-change-in-production-32-chars-min
    depends_on:
      - redis
      - postgres
      - presidio-analyzer
      - presidio-anonymizer
      - minio

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-redactor-celery-beat
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://legal:legal_pass@postgres:5432/legal_redactor
      - REDIS_URL=redis://redis:6379/0
      - REDBEAT_LOCK_KEY=redbeat:lock
      - REDBEAT_LOCK_TIMEOUT=300
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-redactor-frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=legal-redactor
      - VITE_KEYCLOAK_CLIENT_ID=frontend
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmindata:
  redisdata:
  miniodata:
  keycloakdata:

networks:
  default:
    name: legal-redactor-network
