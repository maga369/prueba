[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    db: Database tests
    pii: PII detection tests
    ocr: OCR tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
